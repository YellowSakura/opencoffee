[project]
name = "opencoffee"
version = "0.9.9"
description = "It takes all the members in a Slack channel and pairs them up for a coffee date"
authors = [
    { name = "Yellow Sakura", email = "dev@yellowsakura.com" }
]
readme = "README.md"
license = { text = "MIT" }
homepage = "https://www.yellowsakura.com"
repository = "https://github.com/YellowSakura/opencoffee"
requires-python = ">=3.10"
dependencies = [
    "argparse>=1.4.0",
    "scipy>=1.13.0",
    "slack-sdk>=3.27.2",
    "tqdm>=4.66.4"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "poethepoet>=0.24.0",
    "pylint>=4.0",
    "pytest>=9.0",
    "types-tqdm>=4.66.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
main = "opencoffee:main"

[tool.poe.tasks]
mypy = "mypy --ignore-missing-imports opencoffee/ tests/"
pylint = "pylint opencoffee/* tests/*"
pytest = "pytest"
quality = ["mypy", "pylint", "pytest"]
